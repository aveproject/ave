name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The confidence ratchet diffs a change against where it started,
          # which a single-commit checkout cannot reach.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate all records against the schema
        run: python scripts/validate_records.py

      - name: Validate all crosswalks against the crosswalk schema
        run: python scripts/validate_crosswalks.py

      - name: Check every record has positive and negative conformance fixtures
        run: python scripts/check_fixtures.py

      # Soft warning over every record (issue #98), plus the ratchet over the
      # records this change adds or edits, which fails the run (issue #286).
      - name: Confidence signal, soft warning and ratchet
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              echo "No base to diff against (a new branch), so only the soft warning runs."
              python scripts/check_confidence_signal.py ;;
            *) python scripts/check_confidence_signal.py --ratchet-since "$BASE" ;;
          esac

      # A record's revisions stay append-only, and a change to its severity, status or
      # derived verification_basis since the base carries a revisions entry for it
      # (issue #382). Judged against where the change left its base, the same base as
      # the ratchet above.
      - name: Revisions ratchet, append-only and required for gate-relevant changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              echo "No base to diff against (a new branch), so the revisions ratchet is skipped." ;;
            *) python scripts/check_revisions_ratchet.py --ratchet-since "$BASE" ;;
          esac

      - name: Capability-vulnerability taxonomy soft warning
        run: python scripts/check_vulnerability_taxonomy.py

      - name: Mutation-ThM trail soft warning
        run: python scripts/check_mutation_thm_trail.py

      - name: framework_sources present for every mapped framework (hard failure)
        run: python scripts/check_framework_sources.py --strict

      - name: docs/terms.md matches the live schema (hard failure)
        run: python scripts/check_terms_sync.py

      - name: Run tests
        env:
          # tests/test_frozen_artifacts.py checks that no frozen entry is removed
          # or rehashed since this change left its base, the same base as the
          # confidence ratchet above.
          FROZEN_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pytest tests/ -x -q
