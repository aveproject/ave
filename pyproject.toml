[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bawbel-ave"
version = "1.2.0"
description = "AVE — Agentic Vulnerability Enumeration standard"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.23",
    # Registers the "uri" and "uri-reference" format checkers. Without it,
    # jsonschema parses "format": "uri" and then does nothing with it, so the
    # constraint reads as enforced and is not. Chosen over rfc3987, which is
    # GPL, and over the [format-nongpl] extra, which pulls in thirteen
    # distributions to reach the same two checkers.
    "rfc3986-validator>=0.1.1",
    # Registers the "date-time" format checker used by AVE record metadata.
    "rfc3339-validator>=0.1.4",
]

# Not a Python library -- nothing here imports "bawbel_ave" as a package.
# scripts/ are run directly (python scripts/foo.py) and tests/ check
# records and fixtures directly. This pyproject.toml exists for dependency
# and pytest config only, so tell setuptools there's no package to
# discover/build.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_validate_data.py imports "from scripts import validate_records".
# scripts/ has no __init__.py (deliberately, per the packages = [] note above),
# and bare `pytest` (CI's actual invocation, see .github/workflows/tests.yml)
# does not insert the repo root onto sys.path the way `python -m pytest` does.
# Without this, the import resolves under `python -m pytest` locally but
# fails collection under CI's plain `pytest` invocation.
pythonpath = ["."]
